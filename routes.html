<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.routes">Darshan Routes – Ashtavinayak Darshan</title>
<meta name="description" content="Ashtavinayak Darshan: a trilingual (English, Marathi, Hindi) guide to the eight Ganesha temples of Maharashtra.">
<meta name="theme-color" content="#c85a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="routes" id="top">
<header id="site-header"></header>
<main id="main" class="section container">
  <h1 data-i18n="routesPageTitle">Darshan Routes</h1>
  <p class="lead" data-i18n="routesLead">Pick a starting city, a route and how you will travel. Distances and times are road estimates.</p>
  <div class="form-grid">
    <div class="field"><label data-i18n="startingCity" for="startCity">Starting city</label><select id="startCity"></select></div>
    <div class="field"><label data-i18n="routeType" for="routeType">Route</label><select id="routeType"></select></div>
    <div class="field"><label data-i18n="travelBy" for="travelMode">Travel by</label><select id="travelMode"></select></div>
  </div>
  <div id="routeResult" aria-live="polite"></div>
  <p class="card-meta" data-i18n="mapNote">Maps open in Google Maps. Map labels follow your own Google Maps language settings and cannot be translated by this website.</p>
</main>
<footer id="site-footer"></footer>
<script src="js/temples.js"></script>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/images.js"></script>
<script src="js/pages.js"></script>
<script src="js/routes.js"></script>
</body>
</html>
