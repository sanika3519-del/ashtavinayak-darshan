<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.nearby">Nearby Attractions – Ashtavinayak Darshan</title>
<meta name="description" content="Ashtavinayak Darshan: a trilingual (English, Marathi, Hindi) guide to the eight Ganesha temples of Maharashtra.">
<meta name="theme-color" content="#c85a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="nearby" id="top">
<header id="site-header"></header>
<main id="main" class="section container">
  <h1 data-i18n="nearbyPageTitle">Nearby Tourist Attractions</h1>
  <p class="lead" data-i18n="nearbyLead">Forts, caves, passes and heritage sites you can combine with your temple visits.</p>
  <div class="toolbar" role="search">
      <div class="field">
        <label data-i18n="searchNearby" for="nearbySearch">Search attractions</label>
        <input type="search" id="nearbySearch" autocomplete="off" data-i18n-attr="placeholder:searchNearbyPlaceholder" placeholder="e.g. Shivneri, शिवनेरी, किला">
      </div>
      <button type="button" class="btn btn-outline btn-small" id="clearSearch" data-i18n="clearSearch">Clear search</button>
  </div>
  <div class="chips" id="catChips" role="group" data-i18n-attr="aria-label:category" aria-label="Category"></div>
  <p class="status" id="nearbyCount" role="status" aria-live="polite"></p>
  <div class="grid" id="nearbyGrid"></div>
  <p class="empty" id="nearbyEmpty" hidden data-i18n="noResults">No results found. Try a different spelling or another language.</p>
  <p class="card-meta" data-i18n="mapNote">Maps open in Google Maps. Map labels follow your own Google Maps language settings and cannot be translated by this website.</p>
</main>
<footer id="site-footer"></footer>
<script src="js/temples.js"></script>
<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script src="js/images.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
